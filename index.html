<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06060d">
<title>躲开红色方块</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    width:100%; height:100%; overflow:hidden; background:#06060d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,#0d0d1c 0%,#06060d 70%);
  }
  #gameArea {
    position:relative; overflow:hidden; border-radius:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 24px 70px rgba(0,0,0,0.7);
    background:#0a0a16;
  }
  canvas { display:block; width:100%; height:100%; }

  /* 顶部分数条 */
  #scoreBar {
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:center; padding:14px 16px; pointer-events:none; z-index:5;
  }
  .pill {
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border-radius:10px; padding:6px 14px; font-size:11px; color:rgba(255,255,255,0.5);
    letter-spacing:2px; display:flex; align-items:center; gap:8px;
  }
  #scoreVal { color:#fff; font-size:20px; font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:0; }
  #bestVal { color:rgba(255,255,255,0.75); font-size:14px; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:0; }

  /* 覆盖层（开始 / 结束） */
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; z-index:10;
    background:rgba(6,6,13,0.55); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); padding:24px;
  }
  .overlay h1 {
    font-size:30px; font-weight:800; letter-spacing:3px; margin-bottom:6px;
    background:linear-gradient(90deg,#5ab0ff,#9a6bff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay .sub { color:rgba(255,255,255,0.45); font-size:11px; letter-spacing:3px; margin-bottom:30px; }
  .score-label { font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.4); margin-bottom:8px; }
  .score-final { font-size:52px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; line-height:1; }
  .best-row { margin-top:16px; font-size:13px; color:rgba(255,255,255,0.55); letter-spacing:1px; }
  .best-row b { color:#ffcf5a; font-weight:700; font-size:16px; }
  .new-best { display:inline-block; margin-left:8px; font-size:10px; color:#ffcf5a; border:1px solid rgba(255,207,90,0.5); border-radius:4px; padding:1px 6px; letter-spacing:1px; }
  .controls-hint { margin-top:26px; display:flex; flex-direction:column; gap:10px; color:rgba(255,255,255,0.5); font-size:12px; line-height:1.6; }
  .keys { display:inline-flex; gap:6px; vertical-align:middle; }
  .key {
    display:inline-block; padding:3px 9px; border:1px solid rgba(255,255,255,0.2); border-radius:6px;
    background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.85); font-size:11px; font-weight:600; min-width:22px; text-align:center;
  }
  .btn {
    margin-top:30px; padding:15px 44px; border:none; border-radius:12px; font-size:16px; font-weight:700; letter-spacing:2px;
    cursor:pointer; color:#06121f; background:linear-gradient(135deg,#5ab0ff,#7d6bff);
    box-shadow:0 10px 28px rgba(90,176,255,0.35); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform:scale(0.95); box-shadow:0 6px 16px rgba(90,176,255,0.3); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="gameArea">
    <canvas id="game"></canvas>

    <div id="scoreBar" class="hidden">
      <div class="pill">SCORE <span id="scoreVal">0</span></div>
      <div class="pill">BEST <span id="bestVal">0</span></div>
    </div>

    <!-- 开始界面 -->
    <div id="startScreen" class="overlay">
      <h1>躲开红色方块</h1>
      <div class="sub">DODGE THE RED BLOCKS</div>
      <div class="controls-hint">
        <div><span class="keys"><span class="key">A</span><span class="key">D</span></span> 或 <span class="keys"><span class="key">←</span><span class="key">→</span></span> 控制移动</div>
        <div>手机：按住屏幕左 / 右半边移动</div>
      </div>
      <button id="startBtn" class="btn">开始游戏</button>
    </div>

    <!-- 结束界面 -->
    <div id="overScreen" class="overlay hidden">
      <div class="score-label">FINAL SCORE</div>
      <div id="finalScore" class="score-final">0</div>
      <div class="best-row">最高分 <b id="overBest">0</b><span id="newBestTag" class="new-best hidden">NEW</span></div>
      <button id="restartBtn" class="btn">重新开始</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ============================================================
//  躲开红色方块 —— 单文件 HTML5 小游戏
//  逻辑分辨率 450 x 800 (9:16)，绘制坐标全程使用逻辑坐标
// ============================================================
var LOGICAL_W = 450, LOGICAL_H = 800;

var canvas  = document.getElementById('game');
var ctx     = canvas.getContext('2d');
var gameArea    = document.getElementById('gameArea');
var scoreBar    = document.getElementById('scoreBar');
var scoreValEl  = document.getElementById('scoreVal');
var bestValEl   = document.getElementById('bestVal');
var finalScoreEl= document.getElementById('finalScore');
var overBestEl  = document.getElementById('overBest');
var newBestTag  = document.getElementById('newBestTag');
var startScreen = document.getElementById('startScreen');
var overScreen  = document.getElementById('overScreen');
var startBtn    = document.getElementById('startBtn');
var restartBtn  = document.getElementById('restartBtn');

// ---------- 画布尺寸 / 自适应 ----------
var dpr = 1;
function setupCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width  = Math.floor(LOGICAL_W * dpr);
  canvas.height = Math.floor(LOGICAL_H * dpr);
}
function fitArea() {
  var sw = window.innerWidth, sh = window.innerHeight;
  // 优先以高度为基准，保持 9:16；宽度溢出时改为以宽度为基准
  var w = sh * 9 / 16, h = sh;
  if (w > sw) { w = sw; h = sw * 16 / 9; }
  gameArea.style.width  = Math.floor(w) + 'px';
  gameArea.style.height = Math.floor(h) + 'px';
}

// ---------- 最高分存储 ----------
function getBest() { try { return parseInt(localStorage.getItem('dodge_best') || '0', 10) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('dodge_best', String(v)); } catch (e) {} }
var bestScore = getBest();
bestValEl.textContent  = bestScore;
overBestEl.textContent = bestScore;

// ---------- 音效 (Web Audio API，全部即时合成) ----------
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
}
function tone(freq, dur, type, vol, when) {
  if (!audioCtx) return;
  var t = (when != null ? when : audioCtx.currentTime);
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol) {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var len = Math.floor(audioCtx.sampleRate * dur);
  var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * (1 - i / len); }
  var src = audioCtx.createBufferSource(); src.buffer = buf;
  var filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(vol || 0.4, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t + dur);
}
function sndStart() {
  ensureAudio(); if (!audioCtx) return;
  var t = audioCtx.currentTime;
  tone(523, 0.12, 'triangle', 0.22, t);
  tone(659, 0.12, 'triangle', 0.22, t + 0.10);
  tone(880, 0.20, 'triangle', 0.22, t + 0.20);
}
function sndMilestone() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  tone(1046, 0.10, 'sine', 0.16, t);
  tone(1568, 0.12, 'sine', 0.12, t + 0.06);
}
function sndHit() {
  ensureAudio(); if (!audioCtx) return;
  noiseBurst(0.35, 0.5);
  var t = audioCtx.currentTime;
  tone(180, 0.40, 'sawtooth', 0.28, t);
  tone(90,  0.50, 'sine', 0.22, t);
}

// ---------- 游戏状态 ----------
var state = 'start'; // start | playing | over
var player = { x: LOGICAL_W / 2, y: LOGICAL_H - 95, r: 22, speed: 385, vx: 0 };
var obstacles = [];
var particles = [];
var stars = [];
var elapsed = 0;
var score = 0;
var spawnTimer = 0;
var shake = 0;
var lastMilestone = 0;
var input = { left: false, right: false };

function initStars() {
  stars = [];
  for (var i = 0; i < 42; i++) {
    stars.push({ x: Math.random() * LOGICAL_W, y: Math.random() * LOGICAL_H,
                 s: Math.random() * 1.6 + 0.4, sp: Math.random() * 18 + 6 });
  }
}
initStars();

function resetGame() {
  player.x = LOGICAL_W / 2; player.vx = 0;
  obstacles = []; particles = [];
  elapsed = 0; score = 0; spawnTimer = 0; shake = 0; lastMilestone = 0;
  input.left = false; input.right = false;
}

function startGame() {
  ensureAudio();
  resetGame();
  state = 'playing';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  newBestTag.classList.add('hidden');
  scoreBar.classList.remove('hidden');
  scoreValEl.textContent = '0';
  sndStart();
}

function gameOver() {
  if (state !== 'playing') return;
  state = 'over';
  shake = 24;
  spawnParticles(player.x, player.y, '#ff4d6d', 42);
  spawnParticles(player.x, player.y, '#5ab0ff', 24);
  sndHit();
  var s = Math.floor(score);
  var isNew = false;
  if (s > bestScore) { bestScore = s; setBest(bestScore); isNew = true; }
  bestValEl.textContent  = bestScore;
  overBestEl.textContent = bestScore;
  finalScoreEl.textContent = s;
  if (isNew) newBestTag.classList.remove('hidden'); else newBestTag.classList.add('hidden');
  // 让爆炸先显示一会儿再弹出结束面板
  setTimeout(function () { if (state === 'over') overScreen.classList.remove('hidden'); }, 650);
}

// ---------- 障碍物 / 粒子 ----------
function spawnObstacle() {
  var w = 50 + Math.random() * 70;
  var h = 26 + Math.random() * 22;
  var x = Math.random() * (LOGICAL_W - w);
  var baseSpeed = 190 + elapsed * 7.5;
  var speed = baseSpeed + Math.random() * 60;
  obstacles.push({ x: x, y: -h, w: w, h: h, speed: speed });
}
function spawnParticles(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = Math.random() * 320 + 60;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
                     life: 1, color: color, size: Math.random() * 4 + 2 });
  }
}

// ---------- 碰撞 (圆 vs 矩形) ----------
function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  var nx = Math.max(rx, Math.min(cx, rx + rw));
  var ny = Math.max(ry, Math.min(cy, ry + rh));
  var dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

// ---------- 更新 ----------
function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 620 * dt;
    p.life -= dt * 1.4;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function update(dt) {
  // 背景星点始终缓慢下落，营造氛围
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    s.y += s.sp * dt;
    if (s.y > LOGICAL_H) { s.y = -2; s.x = Math.random() * LOGICAL_W; }
  }

  if (state !== 'playing') {
    updateParticles(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 60);
    return;
  }

  elapsed += dt;
  score += dt * 10; // 每秒 +10 分

  // 玩家移动
  var dir = 0;
  if (input.left) dir -= 1;
  if (input.right) dir += 1;
  player.vx = dir * player.speed;
  player.x += player.vx * dt;
  if (player.x < player.r) player.x = player.r;
  if (player.x > LOGICAL_W - player.r) player.x = LOGICAL_W - player.r;

  // 生成障碍物，频率随时间提高
  spawnTimer += dt;
  var spawnInterval = Math.max(0.42, 1.15 - elapsed * 0.016);
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnObstacle();
    if (elapsed > 25 && Math.random() < 0.25) spawnObstacle(); // 高难度偶发双发
  }

  // 障碍物下落 + 碰撞检测
  for (var j = obstacles.length - 1; j >= 0; j--) {
    var o = obstacles[j];
    o.y += o.speed * dt;
    if (o.y > LOGICAL_H) {
      obstacles.splice(j, 1);
      score += 5; // 躲过奖励
      continue;
    }
    if (circleRectHit(player.x, player.y, player.r - 2, o.x, o.y, o.w, o.h)) {
      gameOver();
      return;
    }
  }

  // 得分里程碑音效（每 100 分）
  var ms = Math.floor(score / 100);
  if (ms > lastMilestone) { lastMilestone = ms; sndMilestone(); }

  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 60);

  scoreValEl.textContent = Math.floor(score);
}

// ---------- 渲染 ----------
function drawBackground() {
  var grd = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
  grd.addColorStop(0, '#13132a');
  grd.addColorStop(1, '#070710');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // 背景星点
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    ctx.globalAlpha = 0.2 + s.s / 3;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // 底部柔光
  var fg = ctx.createLinearGradient(0, LOGICAL_H - 130, 0, LOGICAL_H);
  fg.addColorStop(0, 'rgba(90,176,255,0)');
  fg.addColorStop(1, 'rgba(90,176,255,0.10)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, LOGICAL_H - 130, LOGICAL_W, 130);
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawObstacle(o) {
  ctx.shadowColor = 'rgba(255,59,92,0.6)';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ff3b5c';
  roundRect(o.x, o.y, o.w, o.h, 6); ctx.fill();
  ctx.shadowBlur = 0;
  // 顶部高光
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(o.x + 2, o.y + 2, o.w - 4, Math.max(4, o.h * 0.3), 4); ctx.fill();
}

function drawPlayer() {
  ctx.shadowColor = 'rgba(90,176,255,0.85)';
  ctx.shadowBlur = 24;
  var grd = ctx.createRadialGradient(player.x - 6, player.y - 6, 2, player.x, player.y, player.r);
  grd.addColorStop(0, '#cfe7ff');
  grd.addColorStop(0.5, '#5ab0ff');
  grd.addColorStop(1, '#2a7fd6');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 高光点
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(player.x - 7, player.y - 7, player.r * 0.28, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  drawBackground();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
  if (state === 'playing') drawPlayer();
  drawParticles();
  ctx.restore();
}

// ---------- 主循环 ----------
var lastTime = performance.now();
function loop(ts) {
  var dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05; // 钳制大跨度（切后台台回来时）
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ---------- 输入：键盘 ----------
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'a' || k === 'A' || k === 'ArrowLeft') { input.left = true; e.preventDefault(); }
  else if (k === 'd' || k === 'D' || k === 'ArrowRight') { input.right = true; e.preventDefault(); }
  else if (k === ' ' || k === 'Enter') {
    if (state === 'start' || state === 'over') startGame();
  }
});
window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'a' || k === 'A' || k === 'ArrowLeft') input.left = false;
  else if (k === 'd' || k === 'D' || k === 'ArrowRight') input.right = false;
});

// ---------- 输入：触摸（按住左/右半边移动） ----------
function handleTouch(e) {
  e.preventDefault();
  if (state !== 'playing') return;
  var t = e.touches[0];
  if (!t) { input.left = false; input.right = false; return; }
  var rect = canvas.getBoundingClientRect();
  var x = (t.clientX - rect.left) / rect.width * LOGICAL_W;
  if (x < LOGICAL_W / 2) { input.left = true; input.right = false; }
  else { input.right = true; input.left = false; }
}
function endTouch(e) { e.preventDefault(); input.left = false; input.right = false; }
canvas.addEventListener('touchstart',  handleTouch, { passive: false });
canvas.addEventListener('touchmove',   handleTouch, { passive: false });
canvas.addEventListener('touchend',    endTouch,    { passive: false });
canvas.addEventListener('touchcancel', endTouch,    { passive: false });

// 鼠标按住（桌面端测试/备用）
canvas.addEventListener('mousedown', function (e) {
  if (state !== 'playing') return;
  var rect = canvas.getBoundingClientRect();
  var x = (e.clientX - rect.left) / rect.width * LOGICAL_W;
  if (x < LOGICAL_W / 2) { input.left = true; input.right = false; }
  else { input.right = true; input.left = false; }
});
window.addEventListener('mouseup', function () { input.left = false; input.right = false; });
window.addEventListener('blur', function () { input.left = false; input.right = false; });

// ---------- 按钮 ----------
startBtn.addEventListener('click', function () { startGame(); });
restartBtn.addEventListener('click', function () { startGame(); });

// ---------- 自适应 ----------
function onResize() { fitArea(); setupCanvas(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });

// ---------- 初始化 ----------
setupCanvas();
fitArea();
bestValEl.textContent  = bestScore;
overBestEl.textContent = bestScore;
requestAnimationFrame(loop);

// 暴露只读 + 测试接口（便于自动化测试，不影响游戏运行）
window.DodgeGame = {
  getState: function () { return state; },
  getScore: function () { return Math.floor(score); },
  getBest: function () { return bestScore; },
  getObstacleCount: function () { return obstacles.length; },
  getPlayerX: function () { return player.x; },
  _testGameOver: function () { if (state === 'playing') gameOver(); }
};
</script>
</body>
</html>

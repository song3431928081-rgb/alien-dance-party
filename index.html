<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>捏脸实验室 · 软物理变形</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#06060f;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#11112a 0%,#06060f 75%);}
  #gameArea{position:relative;overflow:hidden;border-radius:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.7);background:#0c1230;
    transform:translateZ(0);transition:transform .05s linear;}
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  /* 顶部 HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:12px 14px;pointer-events:none;z-index:6;}
  .pill{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);border-radius:10px;padding:6px 12px;font-size:11px;color:rgba(255,255,255,.7);
    letter-spacing:1px;display:flex;align-items:center;gap:8px;}
  .pill b{color:#fff;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  #backBtn{pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);
    color:#fff;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;letter-spacing:1px;}
  #backBtn:active{transform:scale(.94);}

  /* 挑战进度条 */
  #challenge{position:absolute;top:50px;left:14px;right:14px;z-index:6;pointer-events:none;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;}
  #chTitle{font-size:12px;color:#fff;font-weight:600;margin-bottom:6px;}
  #chBarWrap{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;}
  #chBar{height:100%;width:0%;background:linear-gradient(90deg,#5ab0ff,#9a6bff);border-radius:5px;transition:width .15s;}
  #chTime{font-size:10px;color:rgba(255,255,255,.55);margin-top:5px;text-align:right;}

  /* 覆盖层 */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:10;background:rgba(6,6,15,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:22px;overflow-y:auto;}
  .logo{font-size:13px;letter-spacing:5px;color:rgba(255,255,255,.45);margin-bottom:4px;}
  .title{font-size:34px;font-weight:800;letter-spacing:2px;margin-bottom:4px;
    background:linear-gradient(90deg,#5ab0ff,#9a6bff,#ff6b9d);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:2px;margin-bottom:26px;}
  .modeRow{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;}
  .modeBtn{padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;
    color:#06121f;background:linear-gradient(135deg,#5ab0ff,#7d6bff);box-shadow:0 10px 26px rgba(90,176,255,.32);
    transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .modeBtn:active{transform:scale(.95);}
  .modeBtn small{font-size:10px;font-weight:600;opacity:.7;letter-spacing:1px;}
  .modeBtn.locked{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);box-shadow:none;cursor:not-allowed;}
  .modeBtn.locked small{color:rgba(255,255,255,.3);}

  .charGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px;margin-bottom:18px;}
  .charCard{border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.05);
    padding:14px 6px;cursor:pointer;transition:transform .12s,border-color .12s;text-align:center;}
  .charCard:active{transform:scale(.95);}
  .charCard .av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px;}
  .charCard .nm{font-size:12px;font-weight:700;}
  .charCard .tt{font-size:9px;color:rgba(255,255,255,.45);margin-top:2px;}

  .chList{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-bottom:18px;}
  .chItem{border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);padding:12px 14px;cursor:pointer;text-align:left;}
  .chItem:active{transform:scale(.97);}
  .chItem .ct{font-size:13px;font-weight:700;}
  .chItem .cd{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;}
  .chItem.done{border-color:rgba(90,255,150,.5);background:rgba(90,255,150,.08);}
  .chItem.done .ct::after{content:" ✓";color:#5aff96;}

  /* 混音模式切换组 */
  .remixPanel{width:100%;max-width:300px;margin-bottom:14px;}
  .remixRow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;}
  .remixRow span{width:54px;color:rgba(255,255,255,.6);}
  .seg{flex:1;display:flex;background:rgba(255,255,255,.06);border-radius:8px;padding:2px;}
  .seg button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:10px;padding:5px 2px;border-radius:6px;cursor:pointer;font-weight:600;}
  .seg button.on{background:#5ab0ff;color:#06121f;}

  .btn{padding:13px 38px;border:none;border-radius:12px;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;
    color:#06121f;background:linear-gradient(135deg,#5ab0ff,#7d6bff);box-shadow:0 10px 26px rgba(90,176,255,.32);}
  .btn:active{transform:scale(.95);}
  .btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;}

  .stars{font-size:30px;letter-spacing:6px;margin:4px 0 6px;}
  .scoreRow{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:4px;}
  .scoreRow b{color:#fff;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .tag{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1px;margin-bottom:18px;}

  .lb{width:100%;max-width:280px;margin:14px 0 18px;text-align:left;}
  .lb h4{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.5);margin-bottom:8px;text-align:center;}
  .lbItem{display:flex;justify-content:space-between;font-size:12px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06);}
  .lbItem .r{color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums;}
  .lbEmpty{text-align:center;font-size:11px;color:rgba(255,255,255,.3);padding:14px;}

  .hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:1px;z-index:5;pointer-events:none;}
  .toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);
    border-radius:14px;padding:16px 26px;font-size:15px;font-weight:700;z-index:20;opacity:0;transition:opacity .25s;text-align:center;max-width:80%;}
  .toast.show{opacity:1;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="wrap">
  <div id="gameArea">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="pill">SCORE <b id="scoreVal">0</b></div>
      <button id="backBtn" class="hidden">返回</button>
      <div class="pill" id="bestPill">BEST <b id="bestVal">0</b></div>
    </div>

    <div id="challenge">
      <div id="chTitle">任务</div>
      <div id="chBarWrap"><div id="chBar"></div></div>
      <div id="chTime"></div>
    </div>

    <div class="hint" id="playHint">拖动 / 双指捏合角色脸部 · 释放即回弹</div>
    <div class="toast" id="toast"></div>

    <!-- 主菜单 -->
    <div id="menuScreen" class="overlay">
      <div class="logo">SOFT BODY FACE LAB</div>
      <div class="title">捏脸实验室</div>
      <div class="sub">轻捏 · 拖拽 · 扭曲 · 拉伸</div>
      <div class="modeRow">
        <button class="modeBtn" id="mFree">自由挤压 <small>FREE SQUEEZE</small></button>
        <button class="modeBtn" id="mChallenge">挑战模式 <small>CHALLENGE</small></button>
        <button class="modeBtn locked" id="mRemix">角色混音 <small id="remixLock">通关挑战后解锁</small></button>
      </div>
      <div class="lb" id="lbMenu">
        <h4>本地 TOP 10 变异人物</h4>
        <div id="lbList"></div>
      </div>
      <button class="btn ghost" id="shareMenuBtn" style="margin-top:6px;">分享到社交媒体</button>
    </div>

    <!-- 角色选择 -->
    <div id="charScreen" class="overlay hidden">
      <div class="title" style="font-size:24px;">选择角色</div>
      <div class="sub">CHOOSE A FACE TO MOLD</div>
      <div class="charGrid" id="charGrid"></div>
      <button class="btn ghost" id="charBack">返回</button>
    </div>

    <!-- 挑战列表 -->
    <div id="chScreen" class="overlay hidden">
      <div class="title" style="font-size:24px;">挑战任务</div>
      <div class="sub">COMPLETE THE DEFORMATION TASKS</div>
      <div class="chList" id="chList"></div>
      <button class="btn ghost" id="chBack">返回</button>
    </div>

    <!-- 混音面板 -->
    <div id="remixScreen" class="overlay hidden">
      <div class="title" style="font-size:24px;">角色混音</div>
      <div class="sub">MIX FEATURES · WEIRDER = HIGHER</div>
      <div class="remixPanel" id="remixPanel"></div>
      <button class="btn" id="remixStart">开始混音</button>
      <button class="btn ghost" id="remixBack" style="margin-top:10px;">返回</button>
    </div>

    <!-- 结果 -->
    <div id="resultScreen" class="overlay hidden">
      <div class="logo" id="resLogo">RESULT</div>
      <div class="stars" id="resStars">★★★</div>
      <div class="scoreRow">变形创意 <b id="resCreate">0</b></div>
      <div class="scoreRow">搞笑程度 <b id="resFunny">0</b></div>
      <div class="scoreRow" id="resBonusRow" style="display:none;">任务奖励 <b id="resBonus">0</b></div>
      <div class="tag">总分</div>
      <div class="title" style="font-size:38px;" id="resTotal">0</div>
      <button class="btn" id="resAgain" style="margin-top:22px;">再捏一次</button>
      <button class="btn ghost" id="resShare" style="margin-top:10px;">分享</button>
      <button class="btn ghost" id="resHome" style="margin-top:10px;">回主菜单</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   捏脸实验室 —— 软物理面部变形休闲游戏（单文件 HTML5）
   物理：Verlet + 位置约束(PBD) + 弹性回弹；角色用 canvas 程序化绘制
   ===================================================================== */
var LW=400, LH=711; // 逻辑画布 (9:16)

var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var gameArea=document.getElementById('gameArea');
var dpr=1;
function setupCanvas(){dpr=Math.min(window.devicePixelRatio||1,3);canvas.width=Math.floor(LW*dpr);canvas.height=Math.floor(LH*dpr);}
function fitArea(){var sw=innerWidth,sh=innerHeight;var w=sh*9/16,h=sh;if(w>sw){w=sw;h=sw*16/9;}gameArea.style.width=Math.floor(w)+'px';gameArea.style.height=Math.floor(h)+'px';}

/* ---------- 工具 ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(hex,amt){var c=hex2rgb(hex);return 'rgb('+clamp(c[0]+amt,0,255)+','+clamp(c[1]+amt,0,255)+','+clamp(c[2]+amt,0,255)+')';}
function rgba(hex,a){var c=hex2rgb(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* ---------- Verlet 点 / 软物理 ---------- */
function Point(x,y,grp){this.x=x;this.y=y;this.px=x;this.py=y;this.rx=x;this.ry=y;this.grp=grp;this.drag=false;}
Point.prototype.update=function(dt,damp){
  if(this.drag)return;
  var vx=(this.x-this.px)*damp, vy=(this.y-this.py)*damp;
  this.px=this.x;this.py=this.y;
  this.x+=vx;this.y+=vy;
};
Point.prototype.springHome=function(k){ // 弹性回弹（弱，让变形慢慢恢复）
  if(this.drag)return;
  this.x+=(this.rx-this.x)*k; this.y+=(this.ry-this.y)*k;
};

  topTop:['ring',200,140], topL:['ring',150,170], topR:['ring',250,170],

  browL:['eyes',172,205], browR:['eyes',228,205],
  // 鼻 nose
  noseBridge:['nose',200,215], noseTip:['nose',200,320], noseL:['nose',188,280], noseR:['nose',212,280],
  nostrilL:['nose',192,318], nostrilR:['nose',208,318],
  // 嘴 mouth
  mouthL:['mouth',170,390], mouthC:['mouth',200,398], mouthR:['mouth',230,390], mouthTop:['mouth',200,392], mouthBot:['mouth',200,410],
  // 耳 ears
  earL:['ears',125,250], earR:['ears',275,250], earTipL:['ears',100,255], earTipR:['ears',300,255],
  // 帽/发/头盔 hat
  hatL:['hat',150,150], hatC:['hat',200,95], hatR:['hat',250,150], hatBrimL:['hat',100,155], hatBrimR:['hat',300,155],
  // 须 whiskers
  whiskL1:['whiskers',150,360], whiskL2:['whiskers',158,375], whiskR1:['whiskers',250,360], whiskR2:['whiskers',242,375],
  // 头盔 helmet
  helmL:['hat',130,180], helmTop:['hat',200,80], helmR:['hat',270,180], helmBot:['hat',200,430], visorC:['hat',200,300]
};

// 角色对每个分组提供覆盖坐标（基于 PT 默认，再做个性化偏移）
function ov(base, over){var o={};for(var k in base){var g=base[k][0];o[k]=[g, base[k][1], base[k][2]];}for(var k in over){o[k]=[over[k][0]??base[k][0], over[k][1], over[k][2]];}return o;}

var CHARACTERS = [
  { id:'critico', name:'Critico', title:'严苛美食家', emoji:'🧐',
    colors:{skin:'#e6c79c', skin2:'#caa074', hair:'#3a2a1a', feature:'#2a2a2a', accent:'#6b3b1a', mouth:'#7a2a2a'},

      cheekL:['ring',150,290],cheekR:['ring',250,290],
      earL:['ears',140,165],earR:['ears',260,165],earTipL:['ears',108,135],earTipR:['ears',292,135],
      eyeL:['eyes',178,235],eyeR:['eyes',222,235],pupilL:['eyes',180,236],pupilR:['eyes',220,236],
      noseBridge:['nose',200,250],noseTip:['nose',200,305],noseL:['nose',190,288],noseR:['nose',210,288],nostrilL:['nose',193,303],nostrilR:['nose',207,303],
      mouthL:['mouth',184,322],mouthC:['mouth',200,326],mouthR:['mouth',216,322],
      whiskL1:['whiskers',150,300],whiskL2:['whiskers',158,315],whiskR1:['whiskers',250,300],whiskR2:['whiskers',242,315],
      hatC:['hat',200,150]}) },
  { id:'noodle', name:'Noodle', title:'傻大个厨师', emoji:'🤪',
    colors:{skin:'#f0c8a0', skin2:'#d0a070', feature:'#c04020', accent:'#b03010', mouth:'#7a2a2a'},
    feat:{ears:'huge',hat:'hair',glasses:false,whiskers:false,helmet:false,smile:'goofy'},
    ov: ov(PT,{topTop:['ring',200,110],topL:['ring',165,140],topR:['ring',235,140],sideL:['ring',148,270],sideR:['ring',252,270],
      jawL:['ring',170,415],jawR:['ring',230,415],chin:['ring',200,435],chinL:['ring',176,425],chinR:['ring',224,425],
      cheekL:['ring',145,300],cheekR:['ring',255,300],
      earL:['ears',128,250],earR:['ears',272,250],earTipL:['ears',92,245],earTipR:['ears',308,245],

      noseBridge:['nose',200,200],noseTip:['nose',200,300],noseL:['nose',178,255],noseR:['nose',222,255],

      cheekL:['ring',150,305],cheekR:['ring',250,305],
      eyeL:['eyes',172,235],eyeR:['eyes',228,235],pupilL:['eyes',174,237],pupilR:['eyes',226,237],

  { id:'astro', name:'Astro', title:'太空英雄', emoji:'🚀',
    colors:{skin:'#e8c0a0', skin2:'#c89070', feature:'#1f6b8a', accent:'#0a3a5a', visor:'#b0e8ff', mouth:'#7a2a2a'},
    feat:{ears:'none',hat:'helmet',glasses:false,whiskers:false,helmet:true,smile:'serious',jaw:'strong'},
    ov: ov(PT,{topTop:['ring',200,170],topL:['ring',165,200],topR:['ring',235,200],sideL:['ring',145,290],sideR:['ring',255,290],
      jawL:['ring',168,400],jawR:['ring',232,400],chin:['ring',200,425],chinL:['ring',176,415],chinR:['ring',224,415],
      cheekL:['ring',150,300],cheekR:['ring',250,300],
      eyeL:['eyes',174,245],eyeR:['eyes',226,245],pupilL:['eyes',176,247],pupilR:['eyes',224,247],
      browL:['eyes',174,220],browR:['eyes',226,220],

var mesh={points:{},springs:[],springsByRest:[]};
function groupRestCoord(grp, charId){
  var ch=CHARACTERS.find(function(c){return c.id===charId;});
  var coords=ch.ov;
  var first=CHARACTERS[0].ov;
  // 收集该组所有点，以默认 ch 坐标；若该角色该点缺失则用第一角色默认
  var r={};
  for(var k in PT){ if(PT[k][0]===grp){ var c=coords[k]||first[k]||PT[k]; r[k]=[c[1],c[2]]; } }
  return r;
}
function buildMesh(featureSources){ // {ring:charId, eyes:charId, ...}
  mesh.points={}; mesh.springs=[]; mesh.springsByRest=[];
  for(var k in PT){
    var grp=PT[k][0];
    var src=featureSources[grp]||featureSources.ring||CHARACTERS[0].id;
    var ch=CHARACTERS.find(function(c){return c.id===src;});
    var c=ch.ov[k]||PT[k];
    mesh.points[k]=new Point(c[1],c[2],grp);
  }
  for(var i=0;i<ADJ.length;i++){
    var a=mesh.points[ADJ[i][0]], b=mesh.points[ADJ[i][1]];
    if(a&&b){ mesh.springs.push({a:a,b:b,rest:dist(a.rx,a.ry,b.rx,b.ry)}); }
  }
}

function getNearestPoint(x,y,radius){
  var best=null,bd=radius*radius;
  for(var k in mesh.points){var p=mesh.points[k];var dx=p.x-x,dy=p.y-y;var d=dx*dx+dy*dy;if(d<bd){bd=d;best=p;}}
  return best;
}
function canvasPos(e){

}

  var pos=canvasPos(e); pointers[e.pointerId]=pos;

  if(p){p.drag=true;p.x=pos.x;p.y=pos.y;p.px=pos.x;p.py=pos.y; pointers[e.pointerId].pt=p; sndGrab(); spawnRipple(pos.x,pos.y,activeChar.colors.accent); spawnParticles(pos.x,pos.y,activeChar.colors.feature,6,120);}

}

/* ---------- 物理 / 更新 ---------- */
var DAMP=0.86, SPRINGK=0.022, PBD_ITERS=5;
function snapHome(soft){
  for(var k in mesh.points){var p=mesh.points[k];p.px=p.x;p.py=p.y;if(!p.drag){if(soft){}else{p.x=p.rx;p.y=p.ry;p.px=p.rx;p.py=p.ry;}}}
}
function solveConstraints(){
  for(var it=0;it<PBD_ITERS;it++){
    for(var i=0;i<mesh.springs.length;i++){
      var s=mesh.springs[i],a=s.a,b=s.b;
      var dx=b.x-a.x,dy=b.y-a.y;var d=Math.sqrt(dx*dx+dy*dy)||0.01;
      var diff=(d-s.rest)/d*0.5;
      var mx=dx*diff,my=dy*diff;
      if(!a.drag){a.x+=mx;a.y+=my;} if(!b.drag){b.x-=mx;b.y-=my;}
    }
  }
}
function computeDeform(){
  var total=0,maxStretch=0;
  for(var i=0;i<mesh.springs.length;i++){var s=mesh.springs[i];var d=dist(s.a.x,s.a.y,s.b.x,s.b.y);var r=d/s.rest;var ext=Math.abs(r-1);total+=ext;if(ext>maxStretch)maxStretch=ext;}
  for(var k in mesh.points){var p=mesh.points[k];total+=Math.abs(p.x-p.rx)+Math.abs(p.y-p.ry);}
  return {total:total,maxStretch:maxStretch};
}
function challengeMetric(m){
  var P=mesh.points;
  switch(m){
    case 'smile': // 嘴角高于嘴中（y更小）= 笑
      return clamp(((P.mouthC.y-P.mouthL.y)+(P.mouthC.y-P.mouthR.y))/2/22,0,1);
    case 'noseStretch':
      var d=dist(P.noseTip.x,P.noseTip.y,P.noseBridge.x,P.noseBridge.y);
      var r=dist(P.noseTip.rx,P.noseTip.ry,P.noseBridge.rx,P.noseBridge.ry);
      return clamp((d/r-1)/1.5,0,1);
    case 'silly':
      var df=computeDeform();
      return clamp(df.total/260,0,1);
  }
  return 0;
}

function update(dt){
  // 粒子 / 波纹 / 震动
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt*1.6;if(p.life<=0)particles.splice(i,1);}
  for(var i=ripples.length-1;i>=0;i--){var r=ripples[i];r.r+=120*dt;r.life-=dt*1.4;if(r.life<=0)ripples.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*55);
  if(distort>0)distort=Math.max(0,distort-dt*2.2);

  if(state!=='playing')return;

  elapsed+=dt;
  for(var k in mesh.points) mesh.points[k].update(dt,DAMP);
  solveConstraints();
  for(var k in mesh.points) mesh.points[k].springHome(SPRINGK);

  var df=computeDeform();
  lastDeform=df.total;
  creativity=clamp(df.total/180,0,1);
  funniness=clamp(df.maxStretch/0.9,0,1);
  // 极端变形触发空间扭曲
  if(df.maxStretch>1.0){distort=Math.min(1,distort+dt*2);if(Math.random()<dt*3){sndExtreme();shake=Math.max(shake,10);}}
  // 拖拽中持续轻音效
  var dragging=false;for(var k in pointers){if(pointers[k].pt){dragging=true;break;}}
  if(dragging&&Math.random()<dt*4) sndStretch(clamp(df.maxStretch,0,1));

  // 计分累积
  scoreAccum+=(creativity*8+funniness*6)*dt;

  // 挑战
  if(mode==='challenge'){
    challengeProgress=challengeMetric(CHALLENGES[challengeIdx].metric);
    var bar=document.getElementById('chBar');bar.style.width=(challengeProgress*100)+'%';
    challengeTimer-=dt;
    document.getElementById('chTime').textContent='剩余 '+Math.max(0,Math.ceil(challengeTimer))+'s';
    if(challengeProgress>=0.85&&!challengeDone){challengeDone=true;sndWin();showToast('挑战成功！'+activeChar.name+'：'+signatureLine());shake=18;spawnParticles(LW/2,LH*0.45,'#5aff96',30,260);}
    if(challengeTimer<=0&&!challengeDone){challengeDone=true;showToast('时间到！继续创作吧');}
    if(challengeDone&&challengeTimer<=0){setTimeout(finishGame,400);}
  }
  document.getElementById('scoreVal').textContent=Math.floor(scoreAccum);
}

  // 变形拉伸线（高拉伸弹簧）
  ctx.strokeStyle=rgba('#5ab0ff',.5);ctx.lineWidth=2;
  for(var i=0;i<mesh.springs.length;i++){var s=mesh.springs[i];var d=dist(s.a.x,s.a.y,s.b.x,s.b.y);var r=d/s.rest;if(r>1.5){
    ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y);ctx.stroke();}}
  // 粒子
  for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  // 波纹
  for(var i=0;i<ripples.length;i++){var r=ripples[i];ctx.globalAlpha=Math.max(0,r.life*0.5);ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,LW,LH);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();
  if(state==='playing'||state==='result'){
    drawFeature(mesh.points);
    drawDeformOverlay();
  }
  ctx.restore();
  // 空间扭曲（极端变形）：画布外层轻微 skew
  if(distort>0){gameArea.style.transform='skew('+(Math.sin(Date.now()/60)*distort*3)+'deg,'+(Math.cos(Date.now()/70)*distort*3)+'deg) scale('+(1-distort*0.02)+')';}
  else gameArea.style.transform='';
}

/* ---------- 主循环 ---------- */
var lastT=performance.now();
function loop(ts){var dt=(ts-lastT)/1000;lastT=ts;if(dt>0.05)dt=0.05;update(dt);render();requestAnimationFrame(loop);}

/* ---------- 流程控制 ---------- */
var menuScreen=document.getElementById('menuScreen'),charScreen=document.getElementById('charScreen'),
    chScreen=document.getElementById('chScreen'),remixScreen=document.getElementById('remixScreen'),
    resultScreen=document.getElementById('resultScreen');
function show(el){[menuScreen,charScreen,chScreen,remixScreen,resultScreen].forEach(function(s){s.classList.add('hidden');});if(el)el.classList.remove('hidden');}

function renderLB(){var lb=getLB();var el=document.getElementById('lbList');el.innerHTML='';
  if(!lb.length){el.innerHTML='<div class="lbEmpty">还没有记录，去捏个脸吧！</div>';return;}
  lb.forEach(function(r,i){var d=document.createElement('div');d.className='lbItem';d.innerHTML='<span>'+(i+1)+'. '+r.name+' <span style="color:rgba(255,255,255,.4)">· '+r.mode+'</span></span><span class="r">'+r.score+'</span>';el.appendChild(d);});}
function refreshUnlocks(){var rem=document.getElementById('mRemix');if(remixUnlocked()){rem.classList.remove('locked');document.getElementById('remixLock').textContent='MIX & MATCH';}else{rem.classList.add('locked');document.getElementById('remixLock').textContent='通关挑战后解锁';}
  document.getElementById('bestVal').textContent=getBest();}

function openMenu(){state='menu';show(menuScreen);renderLB();refreshUnlocks();document.getElementById('hud').classList.add('hidden');document.getElementById('challenge').style.display='none';document.getElementById('playHint').classList.add('hidden');}

function openCharSelect(){show(charScreen);var grid=document.getElementById('charGrid');grid.innerHTML='';
  CHARACTERS.forEach(function(c){var d=document.createElement('div');d.className='charCard';d.style.borderColor=rgba(c.colors.accent,.5);
    d.innerHTML='<div class="av" style="background:'+rgba(c.colors.skin,.3)+';border:2px solid '+rgba(c.colors.accent,.6)+'">'+c.emoji+'</div><div class="nm">'+c.name+'</div><div class="tt">'+c.title+'</div>';
    d.onclick=function(){activeChar=c;startFree();};grid.appendChild(d);});}

function openChallenge(){show(chScreen);var list=document.getElementById('chList');list.innerHTML='';var cl=cleared();
  CHALLENGES.forEach(function(ch,i){var d=document.createElement('div');d.className='chItem'+(cl.indexOf(i)>=0?' done':'');
    var c=CHARACTERS.find(function(x){return x.id===ch.char;});
    d.innerHTML='<div class="ct">'+ch.title+'</div><div class="cd">'+ch.desc+'</div>';
    d.onclick=function(){challengeIdx=i;activeChar=c;startChallenge();};list.appendChild(d);});}

function openRemix(){if(!remixUnlocked())return;show(remixScreen);var panel=document.getElementById('remixPanel');panel.innerHTML='';
  var groups=[['ring','脸型'],['eyes','眼睛'],['nose','鼻子'],['mouth','嘴巴'],['ears','耳朵'],['hat','帽子/发'],['whiskers','胡须']];
  groups.forEach(function(g){
    var row=document.createElement('div');row.className='remixRow';row.innerHTML='<span>'+g[1]+'</span><div class="seg" id="seg-'+g[0]+'"></div>';
    panel.appendChild(row);var seg=row.querySelector('.seg');
    CHARACTERS.forEach(function(c){var b=document.createElement('button');b.textContent=c.name;if(remixSrc[g[0]]===c.id)b.classList.add('on');
      b.onclick=function(){remixSrc[g[0]]=c.id;seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');};seg.appendChild(b);});});}

function startFree(){mode='free';buildMeshFromChar(activeChar);beginPlay();}
function startChallenge(){mode='challenge';buildMeshFromChar(activeChar);challengeTimer=30;challengeDone=false;challengeProgress=0;beginPlay();document.getElementById('challenge').style.display='block';document.getElementById('chTitle').textContent=CHALLENGES[challengeIdx].title;}
function startRemix(){
  mode='remix';
  var byId=function(id){return CHARACTERS.find(function(c){return c.id===id;})||CHARACTERS[0];};
  var ring=byId(remixSrc.ring), eyes=byId(remixSrc.eyes), nose=byId(remixSrc.nose),
      mouth=byId(remixSrc.mouth), ears=byId(remixSrc.ears), hat=byId(remixSrc.hat), wh=byId(remixSrc.whiskers);
  // 合并视觉特征：各部位取自其来源角色，配色以脸型角色为基底
  var mergedFeat={
    ears:ears.feat.ears, hat:hat.feat.hat, helmet:hat.feat.helmet,
    whiskers:wh.feat.whiskers, glasses:eyes.feat.glasses,
    smile:mouth.feat.smile, snout:nose.feat.snout, jaw:ring.feat.jaw
  };
  activeChar={id:'remix',name:'混音怪物',emoji:'🧩',title:'DIY 变种',colors:ring.colors,feat:mergedFeat,ov:ring.ov};
  buildMesh(remixSrc);beginPlay();
}
function buildMeshFromChar(c){var src={};for(var k in remixSrc)src[k]=c.id;buildMesh(src);}
function beginPlay(){
  state='playing';elapsed=0;scoreAccum=0;creativity=0;funniness=0;bonus=0;particles=[];ripples=[];shake=0;distort=0;
  show(null);
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('playHint').classList.remove('hidden');
  setTimeout(function(){document.getElementById('playHint').classList.add('hidden');},3500);
  ensureAudio();sndScore();
}

function finishGame(){
  var total=Math.floor(scoreAccum);
  if(mode==='challenge'&&challengeProgress>=0.85){bonus=200;total+=bonus;setCleared(challengeIdx);}
  if(total>getBest())localStorage.setItem('face_best',String(total));
  addLB({name:activeChar.name+'★',mode:mode==='free'?'自由':'挑战',score:total});
  // 星级
  var st=1;if(creativity>0.4)st=2;if(creativity>0.7||funniness>0.6)st=3;
  document.getElementById('resStars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  document.getElementById('resCreate').textContent=Math.floor(creativity*100);
  document.getElementById('resFunny').textContent=Math.floor(funniness*100);
  document.getElementById('resBonusRow').style.display=mode==='challenge'?'block':'none';
  document.getElementById('resBonus').textContent=bonus;
  document.getElementById('resTotal').textContent=total;
  document.getElementById('resLogo').textContent=mode==='challenge'?'CHALLENGE':mode==='remix'?'REMIX':'FREE';
  state='result';show(resultScreen);refreshUnlocks();renderLB();
  sndWin();
}

document.getElementById('backBtn').onclick=function(){openMenu();};
document.getElementById('mFree').onclick=openCharSelect;
document.getElementById('mChallenge').onclick=openChallenge;
document.getElementById('mRemix').onclick=openRemix;
document.getElementById('charBack').onclick=openMenu;
document.getElementById('chBack').onclick=openMenu;
document.getElementById('remixBack').onclick=openMenu;
document.getElementById('remixStart').onclick=startRemix;
document.getElementById('resAgain').onclick=function(){if(mode==='challenge')startChallenge();else if(mode==='remix')startRemix();else startFree();};
document.getElementById('resHome').onclick=openMenu;
document.getElementById('resShare').onclick=shareGame;
document.getElementById('shareMenuBtn').onclick=shareGame;

function shareGame(){
  var total=document.getElementById('resTotal').textContent||Math.floor(scoreAccum)||0;
  var text='我在《捏脸实验室》把'+activeChar.name+'捏出了'+total+'分！你也来试试 →';
  if(navigator.share){navigator.share({title:'捏脸实验室',text:text}).catch(function(){});}
  else{showToast('已复制：'+text);try{navigator.clipboard.writeText(text);}catch(e){}}
}

/* ---------- 初始化 ---------- */
window.addEventListener('resize',function(){fitArea();setupCanvas();});
window.addEventListener('orientationchange',function(){setTimeout(function(){fitArea();setupCanvas();},250);});
setupCanvas();fitArea();
openMenu();
requestAnimationFrame(loop);
window.FaceGame={getState:function(){return state;},getScore:function(){return Math.floor(scoreAccum);},getMode:function(){return mode;},getDeform:function(){return lastDeform;},getProgress:function(){return challengeProgress;},_forceExtreme:function(){var P=mesh.points;P.noseTip.y=P.noseBridge.y-260;P.mouthL.y-=40;P.mouthR.y-=40;}};
</script>
</body>

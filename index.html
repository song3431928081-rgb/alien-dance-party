<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Alien Dance Party</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;}
#gameArea{position:relative;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.04);background:#ffffff;}
canvas{display:block;width:100%;height:100%;cursor:pointer;will-change:transform;}

/* Top stats */
#topBar{position:absolute;top:0;left:0;right:0;padding:10px 14px;z-index:5;pointer-events:none;
  display:flex;justify-content:space-between;align-items:center;}
.stat{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);border-radius:10px;
  padding:5px 11px;font-size:11px;font-weight:700;color:#333;display:flex;align-items:center;gap:5px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.stat .ico{font-size:14px;}
.stat .num{font-variant-numeric:tabular-nums;min-width:14px;text-align:center;}

/* Combo badge */
#comboBadge{position:absolute;top:48px;left:50%;transform:translateX(-50%) scale(0);
  background:linear-gradient(135deg,#39ff14,#b026ff);color:#fff;font-size:13px;font-weight:800;
  padding:6px 16px;border-radius:20px;z-index:6;pointer-events:none;letter-spacing:1px;
  box-shadow:0 4px 16px rgba(176,38,255,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
#comboBadge.show{transform:translateX(-50%) scale(1);}

/* Bottom control bar — Loopit style */
#bottomBar{position:absolute;bottom:0;left:0;right:0;padding:10px 16px 14px;z-index:8;
  display:flex;align-items:center;justify-content:space-around;gap:8px;
  background:linear-gradient(to top,rgba(255,255,255,.95) 60%,rgba(255,255,255,0));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.bb-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  background:none;border:none;font-size:9px;font-weight:700;color:#666;letter-spacing:.5px;
  transition:transform .12s;-webkit-tap-highlight-color:transparent;}
.bb-btn:active{transform:scale(.88);}
.bb-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.06);transition:all .2s;}
.bb-btn.active .bb-icon{background:linear-gradient(135deg,#39ff14,#b026ff);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(176,38,255,.35);}
.bb-btn.primary .bb-icon{width:48px;height:48px;font-size:24px;
  background:linear-gradient(135deg,#39ff14,#b026ff);color:#fff;border:none;
  box-shadow:0 6px 20px rgba(176,38,255,.4);}

/* Copy/share button */
#copyBtn{position:absolute;top:10px;right:14px;z-index:7;pointer-events:auto;
  background:linear-gradient(135deg,#39ff14,#b026ff);border:none;border-radius:20px;
  padding:7px 14px;font-size:11px;font-weight:800;color:#fff;letter-spacing:1px;cursor:pointer;
  display:flex;align-items:center;gap:5px;box-shadow:0 4px 14px rgba(176,38,255,.35);
  transition:transform .12s;}
#copyBtn:active{transform:scale(.92);}

/* Toast */
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:rgba(20,20,30,.88);color:#fff;font-size:13px;font-weight:600;padding:10px 22px;
  border-radius:14px;z-index:20;opacity:0;transition:all .3s;pointer-events:none;text-align:center;max-width:80%;}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* Hint overlay */
#hintOverlay{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.92);
  transition:opacity .4s;}
#hintOverlay.hide{opacity:0;pointer-events:none;}
.hint-title{font-size:26px;font-weight:800;letter-spacing:1px;margin-bottom:6px;
  background:linear-gradient(135deg,#39ff14,#b026ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hint-sub{font-size:12px;color:#999;margin-bottom:28px;line-height:1.6;}
.hint-tap{font-size:11px;color:#bbb;margin-top:18px;}
.alien-preview{width:80px;height:80px;margin-bottom:12px;animation:bob 1.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-12px) rotate(4deg);}}
</style>
</head>
<body>
<div id="wrap">
  <div id="gameArea">
    <canvas id="game"></canvas>

    <div id="topBar">
      <div class="stat"><span class="ico">👽</span><span class="num" id="countStat">0</span></div>
      <div class="stat"><span class="ico">🎵</span><span class="num" id="comboStat">1x</span></div>
    </div>

    <button id="copyBtn">🛸 COPY</button>

    <div id="comboBadge">DANCE x<span id="comboNum">1</span></div>
    <div id="toast"></div>

    <div id="bottomBar">
      <button class="bb-btn" id="btnAuto"><div class="bb-icon">⏩</div>AUTO</button>
      <button class="bb-btn" id="btnChaos"><div class="bb-icon">🌀</div>CHAOS</button>
      <button class="bb-btn primary" id="btnAdd"><div class="bb-icon">➕</div>ADD</button>
      <button class="bb-btn" id="btnPhoto"><div class="bb-icon">📸</div>PHOTO</button>
      <button class="bb-btn" id="btnClear"><div class="bb-icon">🗑️</div>CLEAR</button>
    </div>

    <div id="hintOverlay">
      <div class="alien-preview" id="previewAlien"></div>
      <div class="hint-title">Alien Dance Party</div>
      <div class="hint-sub">Tap anywhere to spawn dancing aliens<br>Drag aliens to move &amp; arrange them<br>More aliens = faster dance party!</div>
      <button class="bb-btn primary" id="btnStart" style="background:none;border:none;"><div class="bb-icon" style="background:linear-gradient(135deg,#39ff14,#b026ff);color:#fff;border:none;box-shadow:0 6px 20px rgba(176,38,255,.4);">▶</div>START</button>
      <div class="hint-tap">Tap to begin the party</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Alien Dance Party — Casual tap-dance alien spawning game (single-file HTML5)
   Original character & gameplay. Tap to spawn, drag to arrange, dance together.
   ===================================================================== */
var LW=400, LH=711;
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d',{alpha:false});
var gameArea=document.getElementById('gameArea');
var dpr=1;
var canvasRect={left:0,top:0,width:LW,height:LH}; // cached, updated on resize/scroll only

function setupCanvas(){
  dpr=Math.min(window.devicePixelRatio||1,2); // cap at 2 for performance
  canvas.width=Math.floor(LW*dpr);
  canvas.height=Math.floor(LH*dpr);
}
function fitArea(){
  var sw=innerWidth,sh=innerHeight;
  var w=sh*9/16,h=sh;
  if(w>sw){w=sw;h=sw*16/9;}
  gameArea.style.width=Math.floor(w)+'px';
  gameArea.style.height=Math.floor(h)+'px';
  updateCanvasRect();
}
function updateCanvasRect(){
  var r=canvas.getBoundingClientRect();
  canvasRect={left:r.left,top:r.top,width:r.width||LW,height:r.height||LH};
}

/* ---------- Utilities ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function dist(x1,y1,x2,y2){var dx=x1-x2,dy=y1-y2;return Math.sqrt(dx*dx+dy*dy);}

/* ---------- Audio (Web Audio API, fully synthesized) ---------- */
var audio=null, noiseBuf=null;
function ensureAudio(){
  if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audio=null;}}
  if(audio){
    if(audio.state==='suspended')audio.resume();
    if(!noiseBuf){ // pre-allocate noise buffer once, reuse forever
      var len=Math.floor(audio.sampleRate*0.1);
      noiseBuf=audio.createBuffer(1,len,audio.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    }
  }
}
function tone(freq,dur,type,vol,delay){
  if(!audio)return;var n=audio.currentTime+(delay||0);
  var o=audio.createOscillator();o.type=type||'sine';o.frequency.value=freq;
  var g=audio.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol||0.08,n+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,n+dur);
  o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+dur+0.05);
}
function noiseBurst(dur,freq,vol){
  if(!audio||!noiseBuf)return;var n=audio.currentTime;
  var s=audio.createBufferSource();s.buffer=noiseBuf;s.loop=false;
  s.playbackRate.value=noiseBuf.duration/dur; // adjust pitch by speed
  var f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||800;
  var g=audio.createGain();g.gain.value=vol||0.06;
  s.connect(f);f.connect(g);g.connect(audio.destination);s.start(n);s.stop(n+dur);
}
var ufoHum=null;
function startHum(){if(!audio||ufoHum)return;var o=audio.createOscillator();o.type='sawtooth';o.frequency.value=55;
  var f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=200;
  var g=audio.createGain();g.gain.value=0.015;
  o.connect(f);f.connect(g);g.connect(audio.destination);o.start();ufoHum={osc:o,gain:g};}
function stopHum(){if(ufoHum){try{ufoHum.osc.stop();}catch(e){}ufoHum=null;}}

function sndSpawn(){tone(220,.08,'square',.06);tone(330,.1,'square',.05,.04);noiseBurst(.08,600,.04);}
function sndSquelch(){noiseBurst(.06,400,.05);tone(150,.08,'sawtooth',.04);}
function sndZap(){tone(880,.05,'square',.05);tone(660,.06,'square',.04,.03);}
function sndLaugh(){tone(300,.05,'sawtooth',.05);tone(400,.05,'sawtooth',.05,.06);tone(350,.06,'sawtooth',.04,.12);}
function sndBeat(intensity){
  var f=200+intensity*100;
  tone(f,.06,'square',.04);noiseBurst(.04,300,.02);
}
function sndPop(){tone(440,.04,'sine',.06);tone(660,.05,'sine',.05,.03);}
function sndClear(){tone(330,.06,'sawtooth',.05);tone(220,.08,'sawtooth',.04,.06);tone(110,.12,'sawtooth',.03,.12);}
function sndPhoto(){tone(1000,.02,'square',.06);tone(1200,.03,'sine',.05,.04);noiseBurst(.06,2000,.04);}

/* ---------- Pre-rendered glow sprite (replaces expensive shadowBlur) ---------- */
var glowCanvas=document.createElement('canvas');
glowCanvas.width=40;glowCanvas.height=40;
var glowCtx=glowCanvas.getContext('2d');
(function(){var g=glowCtx.createRadialGradient(20,20,2,20,20,20);
  g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(0.3,'rgba(255,255,255,0.4)');
  g.addColorStop(1,'rgba(255,255,255,0)');glowCtx.fillStyle=g;
  glowCtx.fillRect(0,0,40,40);})();

/* ---------- Alien character (original design) ---------- */
// Cute laughing alien: tentacle head, glowing color-shift eyes, slimy blob body
function Alien(x,y){
  this.x=x;this.y=y;this.vx=0;this.vy=0;
  this.tx=x;this.ty=y;
  this.scale=rand(.7,1.1);
  this.targetScale=this.scale;
  this.rotation=rand(-.3,.3);
  this.targetRotation=this.rotation;
  this.bodyR=rand(28,36);
  this.bodySquash=1;this.bodySquashY=1;
  this.colorPhase=rand(0,Math.PI*2);
  this.eyeColorPhase=rand(0,Math.PI*2);
  this.tentacleCount=5+Math.floor(rand(0,3));
  this.tentacles=[];
  for(var i=0;i<this.tentacleCount;i++){
    this.tentacles.push({angle:Math.PI*2*i/this.tentacleCount+rand(-.2,.2),len:rand(30,50),wave:rand(0,Math.PI*2),waveSpeed:rand(2,4)});
  }
  this.dancePhase=rand(0,Math.PI*2);
  this.danceMove=Math.floor(rand(0,3));
  this.danceTimer=rand(1,3);
  this.bob=rand(0,Math.PI*2);
  this.bobSpeed=rand(1.5,3);
  this.dragging=false;
  this.dragOffX=0;this.dragOffY=0;
  this.spawnTime=0;
  this.alpha=0;
  this.mouthOpen=0;
  this.happiness=1;
  this.glow=1;
  this.id=Math.random();
  // cached color values (updated in update, used in draw)
  this._r=57;this._g=255;this._b=20;
  this._eyeIdx=0;
}
Alien.prototype.update=function(dt,beatPhase,danceSpeed){
  this.spawnTime+=dt;
  this.alpha=Math.min(1,this.spawnTime*3);
  // float / anti-gravity bob
  if(!this.dragging){
    this.bob+=dt*this.bobSpeed;
    this.x+=Math.sin(this.bob*0.7)*0.3;
    this.y+=Math.cos(this.bob)*0.4;
  }
  // smooth to target (drag position or settle)
  this.x+=(this.tx-this.x)*0.18;
  this.y+=(this.ty-this.y)*0.18;
  // scale & rotation smooth
  this.scale+=(this.targetScale-this.scale)*0.12;
  this.rotation+=(this.targetRotation-this.rotation)*0.1;
  // color phase
  this.colorPhase+=dt*0.5;
  this.eyeColorPhase+=dt*0.8;
  // tentacle waves
  for(var i=0;i<this.tentacles.length;i++){
    this.tentacles[i].wave+=dt*this.tentacles[i].waveSpeed*danceSpeed;
  }
  // body squash recovery
  this.bodySquash+=(1-this.bodySquash)*0.15;
  this.bodySquashY+=(1-this.bodySquashY)*0.15;
  // dance
  this.dancePhase+=dt*danceSpeed*2;
  this.danceTimer-=dt;
  if(this.danceTimer<=0){this.danceMove=Math.floor(rand(0,3));this.danceTimer=rand(.8,2.5);}
  // mouth (laughing)
  this.mouthOpen=Math.abs(Math.sin(this.dancePhase*1.5))*0.5+0.1;
  // glow pulse
  this.glow=0.6+Math.sin(this.dancePhase)*0.3+0.1;
  // boundary
  this.tx=clamp(this.tx,30,LW-30);
  this.ty=clamp(this.ty,50,LH-100);
  // cache color values (avoid string building in draw)
  var cp=this.colorPhase;
  var r=Math.sin(cp)*0.5+0.5;
  var g=Math.sin(cp+2.1)*0.5+0.5;
  var b=Math.sin(cp+4.2)*0.5+0.5;
  this._r=Math.floor(lerp(57,176,r));
  this._g=Math.floor(lerp(255,38,g));
  this._b=Math.floor(lerp(20,255,b));
  // eye color index (quantize to avoid string lookup every frame)
  this._eyeIdx=Math.floor(((Math.sin(this.eyeColorPhase)*0.5+0.5)*3))%3;
};

Alien.prototype.draw=function(ctx){
  if(this.alpha<=0)return;
  var r=this._r,g=this._g,b=this._b;
  var dr=(r*0.6)|0, dg=(g*0.6)|0, db=(b*0.6)|0;
  var lr=Math.min(r+60,255)|0, lg=Math.min(g+60,255)|0, lb=Math.min(b+60,255)|0;
  var bodyStr='rgb('+r+','+g+','+b+')';
  var darkStr='rgb('+dr+','+dg+','+db+')';
  var lightStr='rgb('+lr+','+lg+','+lb+')';
  var EYE_COLORS=['#39ff14','#b026ff','#ff69b4'];
  var eyeColor=EYE_COLORS[this._eyeIdx];

  ctx.save();
  ctx.globalAlpha=this.alpha;
  ctx.translate(this.x,this.y);
  var dp=this.dancePhase;
  var danceOffX=0,danceOffY=0,danceRot=0,danceScale=1;
  switch(this.danceMove){
    case 0: danceOffX=Math.sin(dp)*8; break;
    case 1: danceRot=dp*0.8; danceOffY=Math.sin(dp*2)*6; break;
    case 2: danceOffY=-Math.abs(Math.sin(dp*2))*15; break;
  }
  if(this.dragging){danceScale=1.1;}
  ctx.rotate(this.rotation+danceRot);
  ctx.scale(this.scale*danceScale,this.scale*danceScale);
  ctx.translate(danceOffX,danceOffY);

  var bs=this.bodySquash,bsy=this.bodySquashY;
  var br=this.bodyR;

  // tentacles (drawn behind body)
  for(var i=0;i<this.tentacles.length;i++){
    var t=this.tentacles[i];
    var ca=Math.cos(t.angle),sa=Math.sin(t.angle);
    var tx1=ca*br*0.7*bs, ty1=sa*br*0.7*bsy;
    var wave=Math.sin(t.wave)*15, wave2=Math.sin(t.wave+1)*8;
    var p2x=ca+wave*Math.cos(t.angle+1.5708), p2y=sa+wave*Math.sin(t.angle+1.5708);
    var tx2=tx1+ca*t.len*bs+wave*Math.cos(t.angle+1.5708);
    var ty2=ty1+sa*t.len*bsy+wave*Math.sin(t.angle+1.5708);
    var tx3=tx2+ca*t.len*0.4+wave2*Math.cos(t.angle+1.5708);
    var ty3=ty2+sa*t.len*0.4+wave2*Math.sin(t.angle+1.5708);
    // tentacle glow (wide, semi-transparent)
    ctx.strokeStyle=lightStr;ctx.lineWidth=8;ctx.lineCap='round';ctx.globalAlpha=this.alpha*0.4;
    ctx.beginPath();ctx.moveTo(tx1,ty1);ctx.quadraticCurveTo(tx2,ty2,tx3,ty3);ctx.stroke();
    ctx.globalAlpha=this.alpha;
    ctx.strokeStyle=bodyStr;ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(tx1,ty1);ctx.quadraticCurveTo(tx2,ty2,tx3,ty3);ctx.stroke();
    ctx.fillStyle=lightStr;ctx.beginPath();ctx.arc(tx3,ty3,5,0,6.283);ctx.fill();
  }

  // body (solid fill + manual highlight, NO createRadialGradient)
  ctx.fillStyle=bodyStr;
  ctx.beginPath();ctx.ellipse(0,0,br*bs,br*bsy,0,0,6.283);ctx.fill();
  // body shading: darker bottom half
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.ellipse(0,br*0.2,br*bs,br*0.5*bsy,0,0,3.1416);ctx.fill();
  // top highlight
  ctx.fillStyle=lightStr;
  ctx.globalAlpha=this.alpha*0.7;
  ctx.beginPath();ctx.ellipse(0,-br*0.3,br*0.7*bs,br*0.35*bsy,0,0,6.283);ctx.fill();
  ctx.globalAlpha=this.alpha;
  // slimy shine spot
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();ctx.ellipse(-br*0.35,-br*0.35,br*0.25*bs,br*0.15*bsy,-0.5,0,6.283);ctx.fill();

  // eyes — glow via pre-rendered sprite instead of shadowBlur
  var eyeY=-br*0.15;
  var eyeSp=br*0.35;
  var eyeSize=7*bs;
  // glow sprite (tinted by drawing sprite then over-drawing eye color)
  ctx.globalAlpha=this.alpha*0.5;
  ctx.drawImage(glowCanvas,-eyeSp-8,eyeY-8,16,16);
  ctx.drawImage(glowCanvas,eyeSp-8,eyeY-8,16,16);
  ctx.globalAlpha=this.alpha;
  // eye fill
  ctx.fillStyle=eyeColor;
  ctx.beginPath();ctx.arc(-eyeSp,eyeY,eyeSize,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(eyeSp,eyeY,eyeSize,0,6.283);ctx.fill();
  // pupils
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-eyeSp+1,eyeY-1,3*bs,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(eyeSp+1,eyeY-1,3*bs,0,6.283);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-eyeSp+1,eyeY-1,1.5*bs,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(eyeSp+1,eyeY-1,1.5*bs,0,6.283);ctx.fill();

  // mouth (laughing)
  var mw=br*0.3*this.mouthOpen+4;
  var mh=br*0.2*this.mouthOpen+2;
  ctx.fillStyle='#1a0a2a';
  ctx.beginPath();ctx.ellipse(0,br*0.25,mw,mh,0,0,6.283);ctx.fill();
  ctx.fillStyle='#ff6b9d';
  ctx.beginPath();ctx.ellipse(0,br*0.25+mh*0.3,mw*0.6,mh*0.5,0,0,6.283);ctx.fill();
  if(this.mouthOpen>0.3){
    ctx.fillStyle='#fff';
    ctx.fillRect(-mw*0.6,br*0.25-mh,mw*0.4,mh*0.5);
    ctx.fillRect(mw*0.2,br*0.25-mh,mw*0.4,mh*0.5);
  }

  // antenna
  ctx.strokeStyle=bodyStr;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-br*bsy);
  ctx.lineTo(Math.sin(dp*1.5)*8,-br*bsy-18);ctx.stroke();
  // antenna bulb glow via sprite
  ctx.globalAlpha=this.alpha*0.4;
  ctx.drawImage(glowCanvas,Math.sin(dp*1.5)*8-7,-br*bsy-25,14,14);
  ctx.globalAlpha=this.alpha;
  ctx.fillStyle=eyeColor;
  ctx.beginPath();ctx.arc(Math.sin(dp*1.5)*8,-br*bsy-18,5,0,6.283);ctx.fill();

  ctx.restore();
};

/* ---------- Game state ---------- */
var aliens=[],particles=[],beams=[],shake=0;
var state='hint',beatPhase=0,beatTimer=0,beatIndex=0;
var autoSpawn=false,chaosMode=false;
var dragTarget=null,dragMode=true;
var lastBeatSound=0;
var comboLevel=1;

function spawnAlien(x,y){
  if(aliens.length>=30){showToast('Max 30 aliens!');return;}
  var a=new Alien(x||rand(60,LW-60),y||rand(120,LH-180));
  a.bodySquash=0.3;a.bodySquashY=1.5; // spawn pop
  aliens.push(a);
  shake=8;
  spawnSpawnParticles(a.x,a.y);
  sndSpawn();
  ensureAudio();startHum();
  updateCombo();
}
function spawnSpawnParticles(x,y){
  if(particles.length>MAX_PARTICLES)return;
  for(var i=0;i<12;i++){
    var a=Math.random()*Math.PI*2,sp=rand(40,150);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
      color:['#39ff14','#b026ff','#ff69b4','#fff'][Math.floor(Math.random()*4)],size:rand(2,5),type:'spark'});
  }
  beams.push({x:x,y:y-100,life:1,width:50});
}
function spawnBeamParticles(x,y){
  if(particles.length>MAX_PARTICLES-6)return;
  for(var i=0;i<6;i++){
    particles.push({x:x+rand(-20,20),y:y-40,vx:rand(-10,10),vy:rand(-80,-30),life:1,
      color:'#39ff14',size:rand(1,3),type:'beam'});
  }
}
function updateCombo(){
  var n=aliens.length;
  var prev=comboLevel;
  comboLevel=Math.max(1,Math.ceil(n/3));
  document.getElementById('comboStat').textContent=comboLevel+'x';
  document.getElementById('countStat').textContent=n;
  var badge=document.getElementById('comboBadge');
  if(comboLevel>prev){
    document.getElementById('comboNum').textContent=comboLevel;
    badge.classList.add('show');
    setTimeout(function(){badge.classList.remove('show');},1500);
    sndPop();
  }
}

/* ---------- Particles / Beams ---------- */
var MAX_PARTICLES=200;
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='spark')p.vy+=300*dt;
    else if(p.type==='beam')p.vy+=20*dt;
    p.life-=dt*(p.type==='beam'?1.5:2);
    if(p.life<=0){particles[i]=particles[particles.length-1];particles.pop();}
  }
  for(var i=beams.length-1;i>=0;i--){
    beams[i].life-=dt*1.5;
    if(beams[i].life<=0){beams[i]=beams[beams.length-1];beams.pop();}
  }
  if(shake>0)shake=Math.max(0,shake-dt*60);
}
// Pre-created beam gradient (reused every frame)
var beamGradient=null;
function drawBeams(){
  if(beams.length===0)return;
  if(!beamGradient){
    beamGradient=ctx.createLinearGradient(0,0,0,100);
    beamGradient.addColorStop(0,'rgba(57,255,20,0)');
    beamGradient.addColorStop(0.5,'rgba(57,255,20,0.3)');
    beamGradient.addColorStop(1,'rgba(176,38,255,0.1)');
  }
  for(var i=0;i<beams.length;i++){
    var b=beams[i];
    ctx.globalAlpha=Math.max(0,b.life*0.4);
    ctx.fillStyle=beamGradient;
    ctx.beginPath();
    ctx.moveTo(b.x-b.width*b.life,b.y);
    ctx.lineTo(b.x+b.width*b.life,b.y);
    ctx.lineTo(b.x+b.width*0.3*b.life,b.y+100);
    ctx.lineTo(b.x-b.width*0.3*b.life,b.y+100);
    ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;
}
// Batch particles by color to reduce fillStyle changes
var _pBuckets={};
function drawParticles(){
  if(particles.length===0)return;
  // group by color
  _pBatches.length=0;
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var key=p.color;
    var idx=_pColorIdx[key];
    if(idx===undefined){idx=_pBatches.length;_pBatches.push({color:key,items:[]});_pColorIdx[key]=idx;}
    _pBatches[idx].items.push(p);
  }
  for(var b=0;b<_pBatches.length;b++){
    var batch=_pBatches[b];
    ctx.fillStyle=batch.color;
    ctx.beginPath();
    for(var j=0;j<batch.items.length;j++){
      var p=batch.items[j];
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.moveTo(p.x+p.size,p.y);
      ctx.arc(p.x,p.y,p.size,0,6.283);
    }
    ctx.fill();
    _pColorIdx[batch.color]=undefined;
  }
  _pBatches.length=0;
  ctx.globalAlpha=1;
}
var _pBatches=[];
var _pColorIdx={};

/* ---------- Dance physics ---------- */
function getDanceSpeed(){
  return 1+aliens.length*0.08;
}
function updateDance(dt){
  var ds=getDanceSpeed();
  beatPhase+=dt*ds*2;
  beatTimer+=dt*ds;
  var beatInterval=0.5/Math.max(1,ds*0.5);
  if(beatTimer>=beatInterval){
    beatTimer=0;
    onBeat(ds);
  }
}
function onBeat(ds){
  // each alien does a beat action
  for(var i=0;i<aliens.length;i++){
    var a=aliens[i];
    if(!a.dragging){
      a.bodySquash=0.7+rand(-0.1,0.1);
      a.bodySquashY=1.3+rand(-0.1,0.1);
      if(Math.random()<0.3)a.danceMove=Math.floor(rand(0,3));
    }
  }
  // sound
  if(aliens.length>0){
    sndBeat(comboLevel*0.3);
    if(Math.random()<0.4)sndZap();
    if(beatIndex%4===0&&Math.random()<0.5)sndLaugh();
  }
  // beam particles
  if(chaosMode){
    for(var i=0;i<aliens.length;i++){
      if(Math.random()<0.3)spawnBeamParticles(aliens[i].x,aliens[i].y);
    }
  }
  beatIndex++;
}

/* ---------- Chaos mode ---------- */
function applyChaos(dt){
  if(!chaosMode)return;
  for(var i=0;i<aliens.length;i++){
    var a=aliens[i];
    if(!a.dragging){
      a.targetRotation+=rand(-2,2)*dt;
      a.targetScale=clamp(a.targetScale+rand(-0.3,0.3)*dt,0.5,1.5);
      if(Math.random()<dt*2){
        a.tx=clamp(a.x+rand(-60,60),30,LW-30);
        a.ty=clamp(a.y+rand(-60,60),50,LH-100);
      }
    }
  }
}

/* ---------- Transparent overlap ---------- */
var _sortBuf=[];
function drawAliens(){
  // copy to reusable buffer, sort in place (no allocation)
  var n=aliens.length;
  _sortBuf.length=n;
  for(var i=0;i<n;i++)_sortBuf[i]=aliens[i];
  _sortBuf.sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<n;i++)_sortBuf[i].draw(ctx);
  _sortBuf.length=0;
}

/* ---------- Render ---------- */
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // white background (replaces clearRect + fillRect with single fill)
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,LW,LH);
  // subtle floor shadow
  ctx.fillStyle='rgba(0,0,0,0.02)';
  ctx.fillRect(0,LH-110,LW,110);

  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // beams (behind aliens)
  drawBeams();

  // aliens with transparent overlap
  if(aliens.length>1){
    ctx.globalCompositeOperation='multiply';
  }
  drawAliens();
  ctx.globalCompositeOperation='source-over';

  // particles
  drawParticles();

  ctx.restore();

  // chaos mode tint
  if(chaosMode){
    ctx.fillStyle='rgba(176,38,255,0.03)';
    ctx.fillRect(0,0,LW,LH);
  }
}

/* ---------- Main loop ---------- */
var lastT=performance.now();
function loop(ts){
  var dt=(ts-lastT)/1000;lastT=ts;if(dt>0.05)dt=0.05;
  if(state==='playing'){
    var ds=getDanceSpeed();
    for(var i=0;i<aliens.length;i++)aliens[i].update(dt,beatPhase,ds);
    updateDance(dt);
    applyChaos(dt);
    // auto spawn
    if(autoSpawn&&aliens.length<25&&Math.random()<dt*0.8){
      spawnAlien(rand(60,LW-60),rand(120,LH-180));
    }
  }
  updateParticles(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------- Input ---------- */
function canvasPos(e){
  return{x:(e.clientX-canvasRect.left)/canvasRect.width*LW,y:(e.clientY-canvasRect.top)/canvasRect.height*LH};
}
function getAlienAt(x,y){
  for(var i=aliens.length-1;i>=0;i--){
    var a=aliens[i];
    var d=dist(x,y,a.x,a.y);
    if(d<a.bodyR*a.scale*1.2)return a;
  }
  return null;
}
canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  if(state!=='playing')return;
  var p=canvasPos(e);
  var a=getAlienAt(p.x,p.y);
  if(a&&dragMode){
    dragTarget=a;a.dragging=true;
    a.dragOffX=p.x-a.x;a.dragOffY=p.y-a.y;
    a.bodySquash=0.6;a.bodySquashY=1.4;
    sndSquelch();
  }else{
    // spawn alien at tap
    spawnAlien(p.x,p.y);
  }
});
canvas.addEventListener('pointermove',function(e){
  e.preventDefault();
  if(state!=='playing')return;
  if(dragTarget){
    var p=canvasPos(e);
    dragTarget.tx=p.x-dragTarget.dragOffX;
    dragTarget.ty=p.y-dragTarget.dragOffY;
    dragTarget.x=dragTarget.tx;
    dragTarget.y=dragTarget.ty;
  }
});
window.addEventListener('pointerup',function(e){
  if(dragTarget){
    dragTarget.dragging=false;
    dragTarget.bodySquash=1.2;dragTarget.bodySquashY=0.8;
    sndPop();
    dragTarget=null;
  }
});
window.addEventListener('pointercancel',function(){
  if(dragTarget){dragTarget.dragging=false;dragTarget=null;}
});
window.addEventListener('blur',function(){
  if(dragTarget){dragTarget.dragging=false;dragTarget=null;}
});

/* ---------- UI ---------- */
var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2000);
}

document.getElementById('btnStart').onclick=function(e){
  e.stopPropagation();
  startGame();
};
function startGame(){
  state='playing';
  document.getElementById('hintOverlay').classList.add('hide');
  ensureAudio();startHum();
  // spawn first alien
  setTimeout(function(){spawnAlien(LW/2,LH*0.45);},300);
}

document.getElementById('btnAdd').onclick=function(e){e.stopPropagation();
  if(state!=='playing')return;
  spawnAlien(rand(60,LW-60),rand(120,LH-180));
};

document.getElementById('btnAuto').onclick=function(e){e.stopPropagation();
  autoSpawn=!autoSpawn;
  this.classList.toggle('active',autoSpawn);
  showToast(autoSpawn?'Auto Spawn ON':'Auto Spawn OFF');
};

document.getElementById('btnChaos').onclick=function(e){e.stopPropagation();
  chaosMode=!chaosMode;
  this.classList.toggle('active',chaosMode);
  showToast(chaosMode?'Chaos Dance ON':'Chaos Dance OFF');
};

document.getElementById('btnPhoto').onclick=function(e){e.stopPropagation();
  if(state!=='playing')return;
  sndPhoto();shake=6;
  // flash
  var flash=document.createElement('div');
  flash.style.cssText='position:absolute;inset:0;background:#fff;z-index:30;opacity:.8;transition:opacity .3s;';
  gameArea.appendChild(flash);
  setTimeout(function(){flash.style.opacity='0';},50);
  setTimeout(function(){flash.remove();},400);
  // capture canvas as image
  try{
    var link=document.createElement('a');
    link.download='alien-dance-'+Date.now()+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    showToast('Photo saved!');
  }catch(err){showToast('Photo saved!');}
};

document.getElementById('btnClear').onclick=function(e){e.stopPropagation();
  if(aliens.length===0)return;
  // pop all
  for(var i=0;i<aliens.length;i++){
    spawnSpawnParticles(aliens[i].x,aliens[i].y);
  }
  aliens=[];
  comboLevel=1;
  document.getElementById('comboStat').textContent='1x';
  document.getElementById('countStat').textContent='0';
  sndClear();shake=10;
  showToast('Cleared!');
};

document.getElementById('copyBtn').onclick=function(e){e.stopPropagation();
  var text='Alien Dance Party! Spawned '+aliens.length+' aliens at '+comboLevel+'x combo! 👽🛸\nPlay: '+location.href;
  if(navigator.share){
    navigator.share({title:'Alien Dance Party',text:text}).catch(function(){});
  }else{
    try{navigator.clipboard.writeText(text);showToast('Copied to clipboard!');}
    catch(err){showToast('Share: '+location.href);}
  }
};

/* ---------- Init ---------- */
function init(){
  setupCanvas();fitArea();
  // draw preview alien on hint overlay
  var pv=document.getElementById('previewAlien');
  pv.innerHTML='<svg viewBox="0 0 80 80" width="80" height="80">'+
    '<ellipse cx="40" cy="42" rx="22" ry="20" fill="#39ff14" stroke="#2ad00f" stroke-width="2"/>'+

    '<circle cx="33" cy="38" r="5" fill="#b026ff"/><circle cx="47" cy="38" r="5" fill="#b026ff"/>'+
    '<circle cx="33" cy="38" r="2" fill="#fff"/><circle cx="47" cy="38" r="2" fill="#fff"/>'+
    '<ellipse cx="40" cy="48" rx="6" ry="3" fill="#1a0a2a"/>'+
    '<line x1="40" y1="22" x2="40" y2="12" stroke="#39ff14" stroke-width="2"/>'+
    '<circle cx="40" cy="10" r="4" fill="#b026ff"/>'+
    '<path d="M20 55 Q15 65 25 68" stroke="#39ff14" stroke-width="4" fill="none" stroke-linecap="round"/>'+
    '<path d="M60 55 Q65 65 55 68" stroke="#39ff14" stroke-width="4" fill="none" stroke-linecap="round"/>'+
    '<path d="M30 58 Q28 68 35 70" stroke="#39ff14" stroke-width="4" fill="none" stroke-linecap="round"/>'+
    '<path d="M50 58 Q52 68 45 70" stroke="#39ff14" stroke-width="4" fill="none" stroke-linecap="round"/>'+
    '<defs><radialGradient id="g1"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs></svg>';

window.addEventListener('resize',function(){fitArea();setupCanvas();});
window.addEventListener('scroll',updateCanvasRect,{passive:true});
window.addEventListener('orientationchange',function(){setTimeout(function(){fitArea();setupCanvas();},300);});
init();
window.AlienGame={
  getState:function(){return state;},
  getAlienCount:function(){return aliens.length;},
  getCombo:function(){return comboLevel;},
  _spawn:function(n){for(var i=0;i<n;i++)spawnAlien(rand(60,LW-60),rand(120,LH-180));},
  _startGame:startGame
};
</script>
